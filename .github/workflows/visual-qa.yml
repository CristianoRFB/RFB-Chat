name: RFB Chat — Real visual QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run real browser visual scenario
        run: npm run test:e2e -- e2e/visual.spec.ts
      - name: Export real synthetic-data screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
