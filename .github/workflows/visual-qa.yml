name: RFB Chat — Real visual QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run real browser visual scenario
        run: npm run test:e2e -- e2e/visual.spec.ts
      - name: Export real synthetic-data screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Print public screenshot bytes for versioning
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if(fs.existsSync('visual-evidence')) for(const name of fs.readdirSync('visual-evidence').filter(n=>n.endsWith('.png'))){const b=fs.readFileSync('visual-evidence/'+name).toString('base64');for(let i=0;i<b.length;i+=4096)console.log('RFB_PNG '+name+' '+String(i/4096)+' '+b.slice(i,i+4096));}"
