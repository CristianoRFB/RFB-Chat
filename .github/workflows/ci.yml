name: RFB Chat — CI de validação local
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies (lockfile ainda pendente)
        run: npm install --no-audit --no-fund
      - name: Publish lockfile for deterministic dependency builds
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build sem conexões de produção
        run: npm run build
      - name: Firestore Rules isoladas (demo-rfb-chat)
        run: npm run test:rules
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Two users and mobile E2E in isolated emulators
        run: npm run test:e2e
      - name: Retain private failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
