name: RFB Chat — paired performance benchmark
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compare actual builds and browser behavior on same runner
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/rfb-before" 6e36ddd9af19da00a427d4a73670d564ba572fc2
          git worktree add --detach "$RUNNER_TEMP/rfb-after" HEAD
          mkdir -p perf-evidence
          result=0
          for variant in before after; do
            dir="$RUNNER_TEMP/rfb-$variant"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$dir/node_modules"
            cp scripts/{instrument-perf,build-size}.mjs "$dir/scripts/"
            cp e2e/performance.spec.ts "$dir/e2e/"
            (
              set -e
              cd "$dir"
              export RFB_PERF_VARIANT="$variant"
              npm run build
              node scripts/build-size.mjs
              node scripts/instrument-perf.mjs
              # Build measured above before benchmark-only port substitution.
              # Separate loopback ports and demo project avoid orphaned baseline processes.
              if [ "$variant" = after ]; then
                node --input-type=module -e "import fs from 'node:fs';const p='firebase.json',j=JSON.parse(fs.readFileSync(p));j.emulators.auth.port=19099;j.emulators.firestore.port=18080;j.emulators.hub={host:'127.0.0.1',port:14400};j.emulators.logging={host:'127.0.0.1',port:14500};fs.writeFileSync(p,JSON.stringify(j));for(const f of ['src/firebase.ts','playwright.config.ts','package.json']){let s=fs.readFileSync(f,'utf8');s=s.replaceAll('9099','19099').replaceAll('8080','18080').replaceAll('5173','15173').replaceAll('demo-rfb-chat','demo-rfb-chat-perf-after');fs.writeFileSync(f,s);}"
              fi
              npm run test:e2e -- e2e/performance.spec.ts
            ) || result=1
            mkdir -p "perf-evidence/$variant"
            if [ -d "$dir/perf-results" ]; then cp -r "$dir/perf-results/." "perf-evidence/$variant/"; fi
            if [ -d "$dir/test-results" ]; then cp -r "$dir/test-results" "perf-evidence/$variant/"; fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfb-performance-evidence
          path: perf-evidence/
          if-no-files-found: warn
          retention-days: 7
