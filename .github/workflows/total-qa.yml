name: RFB Chat — EVOLVE 06 total QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Bounded authenticated load and adversarial concurrency
        env:
          RFB_QA_LOCAL: 'YES'
        run: npx firebase emulators:exec --project demo-rfb-chat --only auth,firestore "node scripts/total-qa-load.mjs"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-qa-load
          path: qa-evidence/
          retention-days: 7
  accessibility-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual.spec.ts e2e/admin.spec.ts
      - name: Synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-qa-visual
          path: visual-evidence/
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
